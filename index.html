<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم البركة | القائمة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= متغيرات الألوان والتصميم ================= */
        :root {
            --primary-color: #e74c3c;
            --secondary-color: #c0392b;
            --accent-color: #f39c12;
            --bg-light: #f8f9fa;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ================= الإعدادات الأساسية ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; scroll-behavior: smooth; }

        /* ================= شريط التنقل (النافبار) ================= */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 28px; font-weight: 800; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
        .nav-actions { display: flex; gap: 20px; align-items: center; }
        .cart-btn {
            background: var(--primary-color); color: var(--white); border: none;
            padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: var(--transition);
            position: relative;
        }
        .cart-btn:hover { background: var(--secondary-color); transform: translateY(-2px); }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--accent-color);
            color: white; font-size: 12px; width: 22px; height: 22px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
        }

        /* ================= قسم الهيرو (الترحيب) ================= */
        .hero {
            margin-top: 80px; padding: 60px 5%; text-align: center;
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), rgba(243, 156, 18, 0.1));
            border-radius: 0 0 50px 50px;
        }
        .hero h1 { font-size: 48px; color: var(--text-dark); margin-bottom: 15px; }
        .hero h1 span { color: var(--primary-color); }
        .hero p { font-size: 18px; color: var(--text-light); max-width: 600px; margin: 0 auto 30px; }

        /* ================= شريط البحث والفلترة ================= */
        .controls-section { max-width: 1200px; margin: -30px auto 30px; padding: 0 5%; position: relative; z-index: 10; }
        .search-bar {
            width: 100%; padding: 18px 25px; border-radius: 50px; border: none;
            box-shadow: var(--shadow); font-size: 16px; outline: none; margin-bottom: 20px;
            transition: var(--transition);
        }
        .search-bar:focus { box-shadow: 0 15px 40px rgba(231, 76, 60, 0.15); }
        
        .categories { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .categories::-webkit-scrollbar { height: 5px; }
        .categories::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .cat-btn {
            padding: 10px 25px; border-radius: 30px; border: 2px solid transparent;
            background: var(--white); color: var(--text-dark); font-weight: bold; cursor: pointer;
            white-space: nowrap; transition: var(--transition); box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .cat-btn.active { background: var(--primary-color); color: var(--white); box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3); }

        /* ================= شبكة المأكولات (المنيو) ================= */
        .menu-container { max-width: 1200px; margin: 0 auto 100px; padding: 0 5%; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .food-card {
            background: var(--white); border-radius: 20px; overflow: hidden;
            box-shadow: var(--shadow); transition: var(--transition); position: relative;
        }
        .food-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(0,0,0,0.12); }
        .food-image { width: 100%; height: 220px; object-fit: cover; }
        
        /* شارة العرض الخاص */
        .offer-badge {
            position: absolute; top: 15px; right: 15px; background: #ff4757; color: white;
            padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .food-details { padding: 20px; }
        .food-title { font-size: 22px; margin-bottom: 5px; color: var(--text-dark); }
        .food-category { font-size: 14px; color: var(--text-light); margin-bottom: 15px; }
        
        .price-section { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .current-price { font-size: 24px; font-weight: 800; color: var(--primary-color); }
        .old-price { font-size: 16px; text-decoration: line-through; color: #a4b0be; }

        .timer-box {
            background: #fff3e0; color: #e65100; padding: 10px; border-radius: 10px;
            text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .add-to-cart-btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: #2ed573; color: white; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: var(--transition); display: flex; justify-content: center; gap: 10px;
        }
        .add-to-cart-btn:hover { background: #26de81; transform: scale(1.02); }

        /* ================= السلة الجانبية (Cart Modal) ================= */
        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; opacity: 0; visibility: hidden; transition: var(--transition);
        }
        .cart-overlay.active { opacity: 1; visibility: visible; }
        .cart-sidebar {
            position: fixed; top: 0; left: -400px; width: 100%; max-width: 400px; height: 100%;
            background: var(--white); z-index: 2001; transition: var(--transition);
            box-shadow: 5px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
        }
        .cart-sidebar.active { left: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { color: var(--text-dark); }
        .close-cart { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--primary-color); }
        
        .cart-items-container { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .cart-item img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; }
        .cart-item-details { flex: 1; }
        .cart-item-title { font-weight: bold; margin-bottom: 5px; }
        .cart-item-price { color: var(--primary-color); font-weight: bold; }
        
        .cart-footer { padding: 20px; border-top: 1px solid #eee; background: var(--bg-light); }
        .total-price { display: flex; justify-content: space-between; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .checkout-btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* ================= التذييل (حقوق HOMOS) ================= */
        footer {
            background: #1e272e; color: #fff; text-align: center; padding: 25px 20px;
            font-size: 15px; position: fixed; bottom: 0; width: 100%; z-index: 900;
        }
        footer b { color: var(--primary-color); font-size: 18px; letter-spacing: 1px; }

        /* حالة التحميل الفارغة */
        .empty-state { text-align: center; padding: 50px; color: var(--text-light); font-size: 20px; width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-utensils"></i> البركة
        </div>
        <div class="nav-actions">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i> السلة
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <h1>مرحباً بك في منصة <span>البركة</span></h1>
        <p>أشهى المأكولات وأقوى العروض الحصرية تصلك ساخنة أينما كنت. تصفح قائمتنا الآن.</p>
    </section>

    <section class="controls-section">
        <input type="text" class="search-bar" id="searchInput" placeholder="🔍 ابحث عن وجبتك المفضلة فوراً... (مثال: شاورما، مشويات)" onkeyup="filterMenu()">
        
        <div class="categories" id="categoriesContainer">
            <button class="cat-btn active" onclick="setCategory('الكل')">الكل 🍽️</button>
            <button class="cat-btn" onclick="setCategory('مشويات')">مشويات 🥩</button>
            <button class="cat-btn" onclick="setCategory('طواجن')">طواجن 🍲</button>
            <button class="cat-btn" onclick="setCategory('مقبلات')">مقبلات 🥗</button>
            <button class="cat-btn" onclick="setCategory('مشروبات')">مشروبات 🥤</button>
        </div>
    </section>

    <main class="menu-container">
        <div class="menu-grid" id="menuGrid">
            <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل أشهى المأكولات...</div>
        </div>
    </main>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>🛒 سلة طلباتك</h2>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items-container" id="cartItemsContainer">
            </div>
        <div class="cart-footer">
            <div class="total-price">
                <span>الإجمالي:</span>
                <span id="cartTotal">0 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="alert('سيتم توجيهك لصفحة الدفع. جميع الحقوق محفوظة لـ HOMOS!')">إتمام الطلب الآن <i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة ومبرمجة بأعلى جودة لـ <b>HOMOS</b> &copy; <span id="currentYear"></span> | منصة مطعم البركة الرسمية
    </footer>

    <script type="module">
        // 1. استدعاء مكتبات Firebase للويب
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDLOsW830rHo7viYDAUehbTkfmBLAiGCg8",
            authDomain: "haaaaa-7e537.firebaseapp.com",
            projectId: "haaaaa-7e537",
            storageBucket: "haaaaa-7e537.firebasestorage.app",
            messagingSenderId: "874151449512",
            appId: "1:874151449512:web:32867d7d7e33170679839d",
            measurementId: "G-4C3P542SC5"
        };

        // تشغيل الفايربيز
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // متغيرات النظام
        let allMenuItems = [];
        let currentCategory = 'الكل';
        let cart = [];

        // 3. الاتصال الحي (Real-time Listener) بقاعدة البيانات
        // onSnapshot: أي تعديل من الأدمن هيسمع هنا فوراً بدون ريفريش
        const menuRef = collection(db, "menu");
        onSnapshot(menuRef, (snapshot) => {
            allMenuItems = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                // نعرض فقط الأكل المتاح (اللي الأدمن معملوش إخفاء)
                if (data.available !== false) {
                    allMenuItems.push({ id: doc.id, ...data });
                }
            });
            renderMenu(); // إعادة رسم المنيو فوراً بعد أي تحديث
        });

        // 4. دالة رسم المأكولات في الشاشة
        window.renderMenu = () => {
            const grid = document.getElementById('menuGrid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const now = new Date();

            // الفلترة بالبحث والتصنيف
            const filteredItems = allMenuItems.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(searchTerm);
                const matchCat = currentCategory === 'الكل' || item.category === currentCategory;
                return matchSearch && matchCat;
            });

            if (filteredItems.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-plate-wheat"></i> عذراً، لا توجد وجبات تطابق بحثك حالياً.</div>';
                return;
            }

            let html = '';
            filteredItems.forEach(item => {
                // فحص العرض الترويجي
                const isOfferValid = item.isOffer && item.offerExpiry && (new Date(item.offerExpiry) > now);
                const priceToShow = isOfferValid ? item.offerPrice : item.price;
                
                html += `
                    <div class="food-card" style="border: ${isOfferValid ? '2px solid #ff4757' : 'none'}">
                        ${isOfferValid ? `<div class="offer-badge">🔥 عرض حصري</div>` : ''}
                        <img src="${item.image || 'https://via.placeholder.com/300?text=بدون+صورة'}" alt="${item.title}" class="food-image">
                        <div class="food-details">
                            <div class="food-category">${item.category}</div>
                            <h3 class="food-title">${item.title}</h3>
                            <div class="price-section">
                                ${isOfferValid ? `
                                    <span class="current-price">${item.offerPrice} ج.م</span>
                                    <span class="old-price">${item.price} ج.م</span>
                                ` : `
                                    <span class="current-price">${item.price} ج.م</span>
                                `}
                            </div>
                            
                            ${isOfferValid ? `<div class="timer-box" data-expiry="${item.offerExpiry}">⏳ جاري حساب الوقت...</div>` : ''}
                            
                            <button class="add-to-cart-btn" onclick="addToCart('${item.id}', '${item.title}', ${priceToShow}, '${item.image}')">
                                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            updateTimers(); // تفعيل العدادات فور الرسم
        };

        // 5. نظام البحث والفلترة السريع
        window.filterMenu = () => { renderMenu(); }
        window.setCategory = (cat) => {
            currentCategory = cat;
            // تظليل الزر المختار
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(cat)) btn.classList.add('active');
            });
            renderMenu();
        };

        // 6. نظام العداد التنازلي الحي للعروض
        window.updateTimers = () => {
            const timers = document.querySelectorAll('.timer-box');
            timers.forEach(timer => {
                const expiryDate = new Date(timer.getAttribute('data-expiry')).getTime();
                setInterval(() => {
                    const now = new Date().getTime();
                    const distance = expiryDate - now;

                    if (distance < 0) {
                        timer.innerHTML = "انتهى العرض ❌";
                        timer.style.background = "#ffeaa7"; timer.style.color = "#d63031";
                        // التحديث التلقائي للسعر هيتم من خلال الـ onSnapshot لما الأدمن يغيره
                    } else {
                        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                        timer.innerHTML = `⏳ متبقي: ${days}يوم و ${hours}:${minutes}:${seconds}`;
                    }
                }, 1000);
            });
        };

        // 7. نظام سلة المشتريات (Cart Logic)
        window.toggleCart = () => {
            document.getElementById('cartOverlay').classList.toggle('active');
            document.getElementById('cartSidebar').classList.toggle('active');
        };

        window.addToCart = (id, title, price, image) => {
            cart.push({ id, title, price, image });
            updateCartUI();
            
            // تأثير حركي بسيط لتأكيد الإضافة
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> تمت الإضافة!';
            btn.style.background = '#e91e63';
            setTimeout(() => { btn.innerHTML = originalText; btn.style.background = '#2ed573'; }, 1000);
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            updateCartUI();
        };

        const updateCartUI = () => {
            document.getElementById('cartCount').innerText = cart.length;
            const container = document.getElementById('cartItemsContainer');
            let total = 0;
            
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 50px 0; color: #7f8c8d;">سلتك فارغة حالياً.</div>';
            } else {
                let html = '';
                cart.forEach((item, index) => {
                    total += item.price;
                    html += `
                        <div class="cart-item">
                            <img src="${item.image}" alt="">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${item.title}</div>
                                <div class="cart-item-price">${item.price} ج.م</div>
                            </div>
                            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#e74c3c; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
            document.getElementById('cartTotal').innerText = `${total} ج.م`;
        };

        // تعيين سنة الحقوق الحالية تلقائياً
        document.getElementById('currentYear').innerText = new Date().getFullYear();
    </script>
</body>
</html>
